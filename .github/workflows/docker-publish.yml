name: Docker Publish Backend

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/binhphanbp/upnext-be

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: vars
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:production"
              echo "${IMAGE_NAME}:sha-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:staging"
              echo "${IMAGE_NAME}:dev"
              echo "${IMAGE_NAME}:sha-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
              echo "${IMAGE_NAME}:sha-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'dev' || github.ref_name == 'main')
    concurrency:
      group: deploy-backend-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          fi

          chmod 644 ~/.ssh/known_hosts

      - name: Deploy backend to VPS
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="production"
          fi

          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "/opt/upnext/scripts/deploy/deploy.sh $ENVIRONMENT backend"

      - name: Notify Telegram success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skip notification."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::12}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            ENVIRONMENT="staging"
            URL="https://api-staging.upnext.works/health"
          else
            ENVIRONMENT="production"
            URL="https://api.upnext.works/health"
          fi

          MESSAGE=$(cat <<EOF
          ✅ UpNext BE deploy success

          Environment: ${ENVIRONMENT}
          Branch: ${{ github.ref_name }}
          Commit: ${SHORT_SHA}
          URL: ${URL}
          Actor: ${{ github.actor }}
          EOF
          )

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" || true

      - name: Notify Telegram failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skip notification."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::12}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="production"
          fi

          MESSAGE=$(cat <<EOF
          ❌ UpNext BE deploy failed

          Environment: ${ENVIRONMENT}
          Branch: ${{ github.ref_name }}
          Commit: ${SHORT_SHA}
          Actor: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" || true
