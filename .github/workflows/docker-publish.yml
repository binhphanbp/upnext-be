name: Docker Publish Backend

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/binhphanbp/upnext-be

jobs:
  migration-safety:
    name: Validate Prisma migration safety
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17-bookworm
        env:
          POSTGRES_USER: upnext
          POSTGRES_PASSWORD: upnext
          POSTGRES_DB: upnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upnext -d upnext_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://upnext:upnext@localhost:5432/upnext_test?schema=public
      JWT_ACCESS_SECRET: ci-jwt-access-secret-that-is-at-least-32-characters
      JWT_ACCESS_EXPIRES_IN: 15m
      APP_ENV: staging
      APP_FRONTEND_URL: https://staging.upnext.works
      CORS_ORIGIN: https://upnext.works,https://staging.upnext.works

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine trusted deployment baseline
        id: migration-baseline
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BASE_SHA="$(bash scripts/get-last-successful-deployment-sha.sh "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"; then
            echo "The last successful deployment is not an ancestor of this commit. Rebase before deploying." >&2
            exit 1
          fi

          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Reject rewritten Prisma migrations
        shell: bash
        env:
          BASE_SHA: ${{ steps.migration-baseline.outputs.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "No successful deployment baseline is available; refuse to build an image." >&2
            exit 1
          fi

          bash scripts/check-prisma-migration-history.sh "$BASE_SHA" "$GITHUB_SHA"

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply Prisma migrations
        run: pnpm prisma:deploy

      - name: Verify Prisma migration status
        run: pnpm exec prisma migrate status

  build-and-push:
    runs-on: ubuntu-latest
    needs: migration-safety

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: vars
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:production"
              echo "${IMAGE_NAME}:sha-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:staging"
              echo "${IMAGE_NAME}:dev"
              echo "${IMAGE_NAME}:sha-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
              echo "${IMAGE_NAME}:sha-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}

  smoke-test:
    name: Smoke test runtime image
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify runtime dependencies and startup command
        shell: bash
        run: |
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA::12}"
          docker pull "$IMAGE"

          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE")" = '["node","dist/main.js"]'
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = 'node'

          docker run --rm --entrypoint node "$IMAGE" -e 'const fs = require("fs"); console.log(require.resolve("express")); if (!fs.existsSync("/app/node_modules/.bin/prisma")) { throw new Error("Prisma CLI is missing"); } if (!fs.existsSync("/app/dist/main.js")) { throw new Error("Application entrypoint is missing"); }'
          docker run --rm --entrypoint sh "$IMAGE" -ec '
            test "$(id -u)" -ne 0
            test -d "$UPLOAD_ROOT/cv"
            probe="$UPLOAD_ROOT/cv/.runtime-write-smoke-$$"
            printf "ok" > "$probe"
            test -s "$probe"
            rm "$probe"
          '

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: [smoke-test, migration-safety]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'dev' || github.ref_name == 'main')
    concurrency:
      group: deploy-backend-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          fi

          chmod 644 ~/.ssh/known_hosts

      - name: Deploy backend to VPS
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="production"
          fi

          if ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "/opt/upnext/scripts/deploy/deploy.sh $ENVIRONMENT backend"; then
            exit 0
          fi

          if [ "$ENVIRONMENT" != "staging" ]; then
            exit 1
          fi

          echo "Initial staging deploy failed. Prisma migration history will not be changed automatically."
          set +e
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -eu
            DATABASE_URL="$(docker inspect --format "{{range .Config.Env}}{{println .}}{{end}}" upnext-backend-staging | sed -n "s/^DATABASE_URL=//p")"
            test -n "$DATABASE_URL"

            docker run --rm \
              --network container:upnext-backend-staging \
              -e DATABASE_URL="$DATABASE_URL" \
              ghcr.io/binhphanbp/upnext-be:staging \
              ./node_modules/.bin/prisma migrate status'
          migration_status=$?
          set -e

          echo "Prisma migration diagnostics exited with status ${migration_status}."
          exit 1

      - name: Notify Telegram success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skip notification."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::12}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            ENVIRONMENT="staging"
            URL="https://api-staging.upnext.works/health"
          else
            ENVIRONMENT="production"
            URL="https://api.upnext.works/health"
          fi

          MESSAGE=$(cat <<EOF
          ✅ UpNext BE deploy success

          Environment: ${ENVIRONMENT}
          Branch: ${{ github.ref_name }}
          Commit: ${SHORT_SHA}
          URL: ${URL}
          Actor: ${{ github.actor }}
          EOF
          )

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" || true

      - name: Notify Telegram failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skip notification."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::12}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="production"
          fi

          MESSAGE=$(cat <<EOF
          ❌ UpNext BE deploy failed

          Environment: ${ENVIRONMENT}
          Branch: ${{ github.ref_name }}
          Commit: ${SHORT_SHA}
          Actor: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" || true
