name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17-bookworm
        env:
          POSTGRES_USER: upnext
          POSTGRES_PASSWORD: upnext
          POSTGRES_DB: upnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upnext -d upnext_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://upnext:upnext@localhost:5432/upnext_test?schema=public
      JWT_ACCESS_SECRET: ci-jwt-access-secret-that-is-at-least-32-characters
      JWT_ACCESS_EXPIRES_IN: 15m
      APP_ENV: staging
      APP_FRONTEND_URL: https://staging.upnext.works
      CORS_ORIGIN: https://upnext.works,https://staging.upnext.works

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine migration change baseline
        id: migration-baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              BASE_SHA="$PR_BASE_SHA"
              ;;
            push)
              BASE_SHA="$PUSH_BEFORE_SHA"
              ;;
            *)
              echo "Unsupported event for migration validation: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "A non-zero 40-character migration baseline SHA is required." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"; then
            echo "The migration baseline is not an ancestor of this commit. Rebase before validating." >&2
            exit 1
          fi

          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Reject rewritten Prisma migrations
        shell: bash
        env:
          BASE_SHA: ${{ steps.migration-baseline.outputs.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "No migration baseline is available; refuse to validate migration history." >&2
            exit 1
          fi

          bash scripts/check-prisma-migration-history.sh "$BASE_SHA" "$GITHUB_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply Prisma migrations
        run: pnpm prisma:deploy

      - name: Verify Prisma migration status
        run: pnpm exec prisma migrate status

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
