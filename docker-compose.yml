services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    container_name: upnext-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: upnext
      POSTGRES_PASSWORD: upnext
      POSTGRES_DB: upnext
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U upnext -d upnext']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upnext-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://upnext:upnext@postgres:5432/upnext?schema=public
      JWT_ACCESS_SECRET: change-me-in-production
      JWT_ACCESS_EXPIRES_IN: 15m
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    ports:
      - '3001:3001'

volumes:
  postgres-data:
